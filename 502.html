<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>502 Bad Gateway</title>

    <link rel="stylesheet" href="./minaui.css">
    <link rel="stylesheet" href="./mina-error.css">
    <link rel="icon" type="image/webp" href="./img/aikon.w/n_ossm_nc.webp">
    <meta name="robots" content="noindex,nofollow">
    <meta property="og:title" content="502 Bad Gateway | お刺身くん">

    <meta name="twitter:card" content="summary_large_image">

</head>
<body class="mina-flex mina-items-center mina-justify-center mina-min-h-screen mina-p-4 mina-error-page">
    <div class="mina-card mina-p-8 mina-text-center mina-w-full mina-flex mina-items-center mina-justify-center mina-flex-col mina-gap-6 mina-error-card">
        <div class="mina-error-code" aria-label="HTTP 502">502</div>
        <h1 class="mina-heading-2 mina-m-0" id="error-title">Bad Gateway</h1>
        <p class="mina-text-sm mina-leading-relaxed mina-error-message">
            サーバーがゲートウェイまたはプロキシとして動作中に、無効なレスポンスを受け取りました。<br>一時的な問題である可能性があります。<br>後ほどお試しください。<br>URLをご確認いただくか、管理者にお問い合わせください。
        </p>
        <div class="mina-flex mina-flex-col mina-gap-4 mina-w-full mina-error-actions">
            <a href="https://ossmxun.net/" class="mina-btn mina-btn--primary mina-justify-center">ホームに戻る</a>
            <button type="button" onclick="history.back()" class="mina-btn mina-btn--glass mina-w-full mina-justify-center">← 前のページに戻る</button>
        </div>
    </div>
    <script src="./minaui.js" defer></script>
