<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contact - お刺身くん | oSsmXun</title>

    <link rel="stylesheet" href="aqua.design.css">
    <link rel="stylesheet" href="aqua.style.css">
    <link rel="stylesheet" href="aqua.effect.css">

    <link rel="icon" type="image/webp" href="https://ossmxun.net/img/aikon.w/n_ossm_nc.webp">
    <link rel="canonical" href="https://ossmxun.net/contact.html">

    <meta name="description" content="お刺身くんへのお問い合わせページです。">

    <meta property="og:title" content="お問い合わせ | お刺身くん">
    <meta property="og:url" content="https://ossmxun.net/contact.html">
    <meta property="og:description" content="お刺身くんへのお問い合わせページです。">
    <meta property="og:image" content="https://ossmxun.net/img/original/new_header.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="お問い合わせ | お刺身くん">
    <meta name="twitter:description" content="お刺身くんへのお問い合わせページです。">
    <meta name="twitter:image" content="https://ossmxun.net/img/original/new_header.png">

    <style>
        body {
            color: #fff;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 1px 1px, rgba(255,255,255,0.18) 1px, transparent 0) 0 0/26px 26px,
                linear-gradient(135deg, var(--aqua-grad-1), var(--aqua-grad-2));
        }
        .home-avatar { width: 128px; height: 128px; object-fit: cover; border: 4px solid #fff; border-radius: 50%; box-shadow: var(--aqua-shadow-lg); flex-shrink: 0; }
        .link-card { text-decoration: none; color: #fff; }
        .link-icon { width: 40px; height: 40px; object-fit: contain; flex-shrink: 0; }
        .link-label { font-size: 1rem; font-weight: 700; display: block; }
        .link-sub { font-size: 0.875rem; opacity: 0.85; }
    </style>
</head>
<body class="aqua-flex aqua-flex-col aqua-items-center aqua-min-h-screen aqua-py-8">

    <header class="aqua-container aqua-container-md aqua-w-full aqua-px-4" style="margin-bottom: 3rem;">
        <div class="aqua-glass aqua-p-8 aqua-flex aqua-md:flex-col aqua-items-center aqua-justify-center aqua-gap-8 aqua-text-center">
            <img class="home-avatar" alt="お刺身くん" src="./img/aikon.w/n_aikon_t.webp">

            <div>
                <h1 class="aqua-heading-1 aqua-text-white aqua-my-4">Contact Me</h1>
                <p class="aqua-text-white aqua-leading-relaxed aqua-text-sm">
                    お問い合わせはこちらから。
                </p>
            </div>
        </div>
    </header>

    <main class="aqua-container aqua-container-sm aqua-w-full" style="margin-bottom: 4rem;">
        <section>
            <h2 class="aqua-heading-2 aqua-text-center aqua-my-4">Reach Out</h2>
            <div class="aqua-grid aqua-gap-4">

                <a href="./" class="aqua-glass aqua-p-4 aqua-flex aqua-items-center aqua-gap-4 aqua-text-white aqua-hover-grow link-card">
                    <img alt="Home" class="link-icon" src="./img/aikon.w/n_aikon_t.webp">
                    <div>
                        <span class="link-label">Home</span>
                        <span class="link-sub">ホームに戻る</span>
                    </div>
                </a>

                <div class="aqua-glass aqua-p-4 aqua-flex aqua-items-center aqua-gap-4 aqua-text-white">
                    <img alt="Email" class="link-icon" src="./img/home.w/e-mail.webp">
                    <div>
                        <span class="link-label">info★ossmxun.net</span>
                        <span class="link-sub">★を@へ置き換えてください。</span>
                    </div>
                </div>

                <a href="https://xu.f5.si/d-sp" class="aqua-glass aqua-p-4 aqua-flex aqua-items-center aqua-gap-4 aqua-text-white aqua-hover-grow link-card">
                    <img alt="Discord" class="link-icon" src="./img/home.w/discord.webp">
                    <div>
                        <span class="link-label">Support Server</span>
                        <span class="link-sub">サポートサーバーです。</span>
                    </div>
                </a>

                <a href="https://x.com/oSsmXun" class="aqua-glass aqua-p-4 aqua-flex aqua-items-center aqua-gap-4 aqua-text-white aqua-hover-grow link-card">
                    <img alt="X" class="link-icon" src="./img/home.w/x.webp">
                    <div>
                        <span class="link-label">X</span>
                        <span class="link-sub">DMよりお問い合わせください。</span>
                    </div>
                </a>

                <a href="https://bsky.app/profile/ossmxun.net" class="aqua-glass aqua-p-4 aqua-flex aqua-items-center aqua-gap-4 aqua-text-white aqua-hover-grow link-card">
                    <img alt="Bluesky" class="link-icon" src="./img/home.w/bluesky.webp">
                    <div>
                        <span class="link-label">Bluesky</span>
                        <span class="link-sub">チャットよりお問い合わせください。</span>
                    </div>
                </a>

            </div>
        </section>
    </main>

    <footer class="aqua-w-full aqua-overflow-hidden aqua-flex aqua-justify-center aqua-items-end" style="margin-top: 6rem;">
        <img src="./img/original/bottom.png" alt="Footer Image" class="aqua-w-full" style="display: block; height: auto;">
    </footer>

</body>
</html>
